name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/java:v1.40.0-jammy
      options: --user 1001

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and run tests
        run: mvn -B clean test

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports

  package-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build package
        run: mvn -B clean package -DskipTests

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpdemo-package
          path: target/*.jar

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar

  deploy-report:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Download Surefire reports
        uses: actions/download-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Inject Feedback Script (Utterances) into HTML Reports
        run: |
          # Injecting the Utterances comments widget just before the closing </body> tag
          SCRIPT='<script src="https://utteranc.es/client.js" repo="sekhlucifer/Testing" issue-term="pathname" theme="github-light" crossorigin="anonymous" async></script>'
          
          # Add to emailable-report.html
          if [ -f "target/surefire-reports/emailable-report.html" ]; then
            sed -i "s|</body>|$SCRIPT</body>|g" target/surefire-reports/emailable-report.html
          fi
          
          # Add to index.html
          if [ -f "target/surefire-reports/index.html" ]; then
            sed -i "s|</body>|$SCRIPT</body>|g" target/surefire-reports/index.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/surefire-reports
          publish_branch: gh-pages
          force_orphan: true
