name: CI/CD Premium Test Report

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-tests-and-publish:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/java:v1.40.0-jammy
      options: --user 1001

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run Playwright Tests (Generates Premium Report)
        run: mvn -B clean test
        continue-on-error: true

      - name: Deploy Premium Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
